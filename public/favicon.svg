<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cgen-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="cgen-shine" cx="16" cy="16" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cgen-spark" x1="36" y1="26" x2="48" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="cgen-glow" x="30" y="20" width="24" height="24" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Brand Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cgen-bg)"/>
  
  <!-- Subtle Lighting Gloss -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cgen-shine)"/>
  
  <!-- Inner Border Highlight -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Bold Monogram "C" -->
  <path d="M 45.5 21 C 41.5 15.5 35.5 13.5 29.5 13.5 C 19 13.5 13 21 13 32 C 13 43 19 50.5 29.5 50.5 C 35.5 50.5 41.5 48.5 45.5 43"
        stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI Spark Accent -->
  <path d="M 42 26 Q 42 32 48 32 Q 42 32 42 38 Q 42 32 36 32 Q 42 32 42 26 Z"
        fill="url(#cgen-spark)" filter="url(#cgen-glow)"/>
</svg>
